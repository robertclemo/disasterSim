<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Disaster Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #1d1d2b; --gold: #ffd23f; --cyan: #7cf2ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ef;
      touch-action: none; user-select: none; -webkit-user-select: none;
      font-family: 'Lilita One', system-ui, sans-serif; color: #fff; }
    canvas { display: block; }
    .stroke { text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 4px 0 var(--ink); }

    #hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 16px 0; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat .k { font-size: 13px; letter-spacing: 1px; opacity: .95; }
    .stat .v { font-size: 30px; line-height: 1; }
    .stat.right { align-items: flex-end; text-align: right; }

    #next { margin: 12px auto 0; width: min(340px, 82vw); }
    #next .label { font-size: 15px; text-align: center; margin-bottom: 4px; }
    #next .bar { height: 14px; border-radius: 8px; background: rgba(29,29,43,.55); border: 2px solid var(--ink); overflow: hidden; }
    #next .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), #b388ff); transition: width .2s; }

    #banner { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
      text-align: center; transition: transform .25s cubic-bezier(.3,1.6,.6,1), opacity .25s; pointer-events: none; }
    #banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    #banner .a { font-size: 22px; color: var(--cyan); }
    #banner .b { font-size: clamp(36px, 11vw, 64px); color: var(--gold); line-height: 1.05; }

    #heavy { position: fixed; left: 50%; top: 46%; transform: translateX(-50%); text-align: center;
      opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
    #heavy.show { opacity: 1; }
    #heavy .a { font-size: clamp(32px, 10vw, 54px); color: #ff5a5f; }
    #heavy .b { font-size: 18px; }

    .pop { position: fixed; font-size: 24px; color: var(--gold); pointer-events: none;
      animation: pop .9s ease-out forwards; transform: translate(-50%, -50%); }
    @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }

    #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.75); background: rgba(255,255,255,.08); opacity: 0;
      transition: opacity .12s; pointer-events: none; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
      background: #3d4466; border: 3px solid rgba(255,255,255,.85); transform: translate(-50%, -50%); }

    #hint { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); width: 100%; text-align: center;
      font-size: 18px; transition: opacity .6s; pointer-events: none; }

    #end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20, 16, 40, .6); text-align: center; gap: 10px; padding: 24px; }
    #end.show { display: flex; }
    #end .t { font-size: clamp(40px, 12vw, 72px); color: var(--gold); }
    #end p { font-size: 20px; margin: 0; }
    [hidden] { display: none !important; }
    #pick { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; background: rgba(20, 16, 40, .45); transition: opacity .35s; }
    #pick.gone { opacity: 0; pointer-events: none; }
    #pick .t { font-size: clamp(34px, 10vw, 64px); color: var(--gold); text-align: center; line-height: 1; }
    .modes { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .modes button { display: flex; flex-direction: column; gap: 2px; min-width: 180px; padding: 16px 22px; }
    .modes .m { font-size: 30px; }
    .modes .d { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .modes button.storm { background: #c9b79c; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    button { font-family: inherit; font-size: 22px; padding: 12px 28px; border-radius: 14px; border: 3px solid var(--ink);
      background: var(--cyan); color: var(--ink); cursor: pointer; margin-top: 12px; box-shadow: 0 4px 0 var(--ink); }
  </style>
</head>
<body>
  <div id="hud" hidden>
    <div class="row">
      <div class="stat stroke"><span class="k">MASS</span><span class="v" id="mass">0</span></div>
      <div class="stat right stroke"><span class="k" id="statLabel">LIFT</span><span class="v" id="lift">3</span></div>
    </div>
    <div id="next">
      <div class="label stroke" id="nextLabel">Next: Cows</div>
      <div class="bar"><div class="fill" id="nextFill"></div></div>
    </div>
  </div>
  <div id="banner" class="stroke"><div class="a" id="bannerLead">NOW LIFTING</div><div class="b" id="bannerText">COWS</div></div>
  <div id="heavy" class="stroke"><div class="a">TOO HEAVY</div><div class="b" id="heavyText">keep eating</div></div>
  <div id="hint" class="stroke" hidden>Drag anywhere to fly · WASD on keyboard</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="pick">
    <div class="t stroke">PICK YOUR DISASTER</div>
    <div class="modes">
      <button data-mode="ufo"><span class="m">UFO</span><span class="d">Beam it all up</span></button>
      <button data-mode="tornado" class="storm"><span class="m">TORNADO</span><span class="d">Fling it all around</span></button>
    </div>
  </div>
  <div id="end" class="stroke">
    <div class="t" id="endTitle">NOTHING LEFT</div>
    <p id="endText">You ate the whole canyon.</p>
    <button id="again">Play again</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
